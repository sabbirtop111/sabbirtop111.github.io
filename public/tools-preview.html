<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Warm glass preview</title>
<style>
  body { margin:0; color:#fff7ed; font-family:"Segoe UI",sans-serif; background:radial-gradient(90% 60% at 0 0, rgba(245,185,66,.16), transparent 55%), #0b0a09; }
  .frame { position:fixed; inset:12px; border:1px solid rgba(245,185,66,.35); border-radius:24px; pointer-events:none; }
  .wrap { max-width:880px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:42px; margin:6px 0; letter-spacing:-.04em; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .card { border-radius:20px; padding:16px; background:linear-gradient(180deg, rgba(255,247,237,.12), rgba(255,247,237,.03)); border:1px solid rgba(245,185,66,.28); box-shadow:inset 0 1px 0 rgba(255,255,255,.16); }
  .go { display:inline-block; margin-top:12px; background:#f5b942; color:#1c1408; font-weight:800; border-radius:999px; padding:8px 12px; text-decoration:none; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="wrap">
  <p style="letter-spacing:.16em;text-transform:uppercase;color:#f5b942;font-size:12px">Warm glass</p>
  <h1>Gamer Sabbir</h1>
  <p>নীল নেই। সোনালি গ্লাস কার্ড। Quick jump নেই।</p>
  <div class="cards">
    <a class="card" href="#"><b>Like</b><br/>ফুল কার্ড<span class="go">Open</span></a>
    <a class="card" href="#"><b>Info</b><br/>ফুল কার্ড<span class="go">Open</span></a>
    <a class="card" href="#"><b>Guild Join</b><br/>নতুন<span class="go">Open</span></a>
    <a class="card" href="#"><b>Guild Quit</b><br/>নতুন<span class="go">Open</span></a>
  </div>
</div>
</body>
</html>
